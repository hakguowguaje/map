<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학원가 마라탕 집 안내 서비스</title>
    
    <!-- 카카오 JavaScript SDK 로드 (autoload=false 옵션으로 로딩 안정성 확보) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ce9d479a8fb59823796c1504cccd9587&libraries=services&autoload=false"></script>
    
    <style>
        /* CSS 스타일 시작 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 화면 전체 레이아웃 (Flexbox를 사용한 좌우 2분할) */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 영역: 탭 및 결과 리스트 */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 사이드바 헤더 타이틀 */
        .header-title {
            padding: 16px 20px 12px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            background-color: #ffffff;
        }

        /* 탭 버튼 영역 */
        .tab-container {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 0 10px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: transparent;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            color: #e63946; /* 마라탕 느낌의 붉은 포인트 색상 */
            border-bottom-color: #e63946;
        }

        .tab-button:hover {
            color: #e63946;
        }

        /* 검색 결과 목록 영역 */
        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .place-item {
            padding: 15px;
            margin-bottom: 10px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .place-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .place-name {
            font-weight: bold;
            font-size: 15px;
            color: #1e1e1e;
            margin-bottom: 4px;
        }

        .place-address {
            font-size: 13px;
            color: #666;
            margin-bottom: 2px;
        }

        .place-phone {
            font-size: 12px;
            color: #007bff;
        }

        /* 오른쪽 영역: 지도 */
        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 현재 위치로 이동 버튼 스타일 */
        .current-location-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 5;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
        }

        .current-location-btn:hover {
            background-color: #f1f1f1;
        }

        /* 상세 팝업(InfoWindow) 내부 스타일 */
        .info-popup {
            padding: 10px;
            min-width: 180px;
            max-width: 250px;
        }

        .info-popup-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .info-popup-address {
            font-size: 12px;
            color: #666;
            word-break: keep-all;
        }
        /* CSS 스타일 끝 */
    </style>
</head>
<body>

    <!-- 화면 구조 시작 -->
    <div class="container">
        <!-- 왼쪽 패널 -->
        <div class="sidebar">
            <div class="header-title">🎓 학원가 마라탕 가이드</div>
            
            <!-- 탭 버튼 영역 -->
            <div class="tab-container">
                <button class="tab-button active" id="academyTab" onclick="switchTab('academy')">🏫 학원 (AC5)</button>
                <button class="tab-button" id="maratangTab" onclick="switchTab('maratang')">🍜 마라탕 가게</button>
            </div>

            <!-- 검색 결과가 출력되는 부분 -->
            <div class="result-list" id="resultList"></div>
        </div>

        <!-- 오른쪽 지도 영역 -->
        <div class="map-container">
            <div id="map"></div>
            <!-- 현재 위치 재탐색 버튼 -->
            <button class="current-location-btn" onclick="moveToCurrentLocation()" title="현재 위치로 이동">🎯</button>
        </div>
    </div>
    <!-- 화면 구조 끝 -->

    <!-- JavaScript 시작 -->
    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let ps;  // 장소 검색 객체
        let markers = []; // 검색 결과 마커들을 담을 배열
        let currentMarker = null; // 현재 위치 표시 마커
        let infowindow; // 마커 클릭 시 나타날 상세 정보창
        
        // 현재 사용자 위치 좌표 저장 변수 (기본값: 서울시청)
        let currentUserLat = 37.5665;
        let currentUserLng = 126.9780;
        
        // 현재 활성화된 탭 ('academy' 또는 'maratang')
        let currentTab = 'academy';

        // 카카오 지도 SDK 로드가 완료되면 실행되는 함수
        kakao.maps.load(function () {
            // HTML5 Geolocation API로 현재 위치 요청
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        // 위치 가져오기 성공 시 좌표 업데이트
                        currentUserLat = position.coords.latitude;
                        currentUserLng = position.coords.longitude;
                        
                        initMap(currentUserLat, currentUserLng);
                    },
                    function (error) {
                        console.warn("위치 정보를 가져올 수 없어 기본 위치로 설정합니다.", error);
                        initMap(currentUserLat, currentUserLng);
                    }
                );
            } else {
                initMap(currentUserLat, currentUserLng);
            }
        });

        // 지도를 생성하고 설정하는 함수
        function initMap(latitude, longitude) {
            let container = document.getElementById('map');
            
            let options = {
                center: new kakao.maps.LatLng(latitude, longitude),
                level: 5 // 지도의 확대 레벨 5
            };

            // 지도 및 검색 서비스 객체 초기화
            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 현재 위치 마커 표시
            displayCurrentLocationMarker(latitude, longitude);

            // 초기 탭(학원) 검색 수행
            loadTabData();
        }

        // 현재 위치 마커를 생성하고 지도에 띄우는 함수
        function displayCurrentLocationMarker(latitude, longitude) {
            if (currentMarker) {
                currentMarker.setMap(null); // 기존 마커 삭제
            }

            let position = new kakao.maps.LatLng(latitude, longitude);
            currentMarker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            // 현재 위치 마커 상단에 간단 안내창 표시
            let locationWindow = new kakao.maps.InfoWindow({
                content: '<div style="padding:5px;font-size:12px;font-weight:bold;">📍 내 위치</div>'
            });
            locationWindow.open(map, currentMarker);
        }

        // [기능 추가] 현재 위치 버튼 클릭 시 실행되는 함수
        function moveToCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        currentUserLat = position.coords.latitude;
                        currentUserLng = position.coords.longitude;
                        
                        let moveLatLon = new kakao.maps.LatLng(currentUserLat, currentUserLng);
                        
                        // 현재 위치 마커 재설정 및 지도 부드럽게 이동
                        displayCurrentLocationMarker(currentUserLat, currentUserLng);
                        map.panTo(moveLatLon);
                        
                        // 현재 위치 주변 기준으로 데이터 재검색
                        loadTabData();
                    },
                    function (error) {
                        alert('현재 위치 정보를 가져올 수 없습니다.');
                    }
                );
            }
        }

        // 탭 버튼 클릭 시 호출되는 함수
        function switchTab(tabName) {
            if (currentTab === tabName) return; // 이미 선택된 탭이면 무시

            currentTab = tabName;

            // 탭 버튼 UI 활성화 상태 전환
            document.getElementById('academyTab').classList.toggle('active', tabName === 'academy');
            document.getElementById('maratangTab').classList.toggle('active', tabName === 'maratang');

            // 새 탭 데이터 불러오기
            loadTabData();
        }

        // 선택된 탭에 따라 카카오 검색 API 호출 함수
        function loadTabData() {
            let center = map.getCenter(); // 현재 지도 중심 좌표 기준
            
            let options = {
                location: center,
                radius: 3000 // 반경 3km 내 검색
            };

            if (currentTab === 'academy') {
                // 탭 1: 카테고리 코드 'AC5' (학원) 검색
                ps.categorySearch('AC5', placesSearchCB, options);
            } else if (currentTab === 'maratang') {
                // 탭 2: 키워드 '마라탕' 검색
                ps.keywordSearch('마라탕', placesSearchCB, options);
            }
        }

        // 장소 검색 완료 시 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                clearResults();
                alert('주변에 해당 장소가 없습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록 및 마커 출력 함수
        function displayPlaces(places) {
            let listEl = document.getElementById('resultList');
            let bounds = new kakao.maps.LatLngBounds();

            // 기존 마커 및 목록 지우기
            clearResults();

            for (let i = 0; i < places.length; i++) {
                let placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 마커 추가
                let marker = addMarker(placePosition);
                
                // 리스트 아이템 추가
                let itemEl = createPlaceItem(places[i], i);

                // 지도 범위 재설정을 위해 좌표 추가
                bounds.extend(placePosition);

                let addressText = places[i].road_address_name ? places[i].road_address_name : places[i].address_name;

                // 마커 및 목록 클릭 이벤트 등록
                (function (marker, title, address) {
                    // 마커 클릭시 상세 팝업 표시
                    kakao.maps.event.addListener(marker, 'click', function () {
                        displayDetailPopup(marker, title, address);
                    });

                    // 리스트 아이템 클릭 시 해당 위치로 이동 및 상세 팝업 표시
                    itemEl.addEventListener('click', function () {
                        map.panTo(placePosition);
                        displayDetailPopup(marker, title, address);
                    });
                })(marker, places[i].place_name, addressText);

                listEl.appendChild(itemEl);
            }

            // 검색된 장소들이 한눈에 보이도록 지도 영역 조정
            map.setBounds(bounds);
        }

        // 리스트 아이템 HTML 요소 생성 함수
        function createPlaceItem(place, index) {
            let el = document.createElement('div');
            el.className = 'place-item';

            let addressText = place.road_address_name ? place.road_address_name : place.address_name;

            el.innerHTML = `
                <div class="place-name">${index + 1}. ${place.place_name}</div>
                <div class="place-address">${addressText}</div>
                <div class="place-phone">${place.phone || '전화번호 정보 없음'}</div>
            `;

            return el;
        }

        // 지도 마커 생성 및 저장 함수
        function addMarker(position) {
            let marker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            markers.push(marker);
            return marker;
        }

        // 기존 마커 및 리스트 초기화 함수
        function clearResults() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
            
            document.getElementById('resultList').innerHTML = '';
            if (infowindow) {
                infowindow.close();
            }
        }

        // [기능 추가] 마커 클릭 시 장소 이름과 주소를 보여주는 상세 팝업 함수
        function displayDetailPopup(marker, title, address) {
            let content = `
                <div class="info-popup">
                    <div class="info-popup-title">${title}</div>
                    <div class="info-popup-address">📍 ${address}</div>
                </div>
            `;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
